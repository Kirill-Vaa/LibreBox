version: 1.3.18

interface:
  customWelcome: 'Welcome to LibreBox! Enjoy!'
  landingFooter: false
  buildInfo: false

  runCode: false
  contextCost: true
  feedback: false
  marketplace:
    use: false
  mcpServers:
    configureObo: true
  remoteAgents:
    use: true
    create: true
  schedules:
    use: true
    maxPerUser: 999999
    minIntervalMinutes: 1
  defaultPinnedTools:
    - 'artifacts'
    - 'web_search'
    - 'skills'
    - 'mcp'

  historyCacheTtlMs: 600000
  replyNotifications:
    pollIntervalMs: 10000
  temporaryChatRetention: 24

projects:
  maxFiles: 500
  maxDescriptionLength: 10000
  maxInstructionsLength: 200000

speech:
  tts:
    allowedAddresses:
      - 'nginx:8098'
    openai:
      url: 'http://nginx:8098/v1/audio/speech'
      apiKey: '${OPENROUTER_API_KEY}'
      model: 'x-ai/grok-voice-tts-1.0'
      voices:
        - 'ara'
        - 'eve'
        - 'leo'
        - 'rex'
        - 'sal'
  stt:
    openai:
      url: 'https://api.groq.com/openai/v1/audio/transcriptions'
      apiKey: '${GROQ_API_KEY}'
      model: 'whisper-large-v3-turbo'

  speechTab:
    advancedMode: true

mcpSettings:
  allowedAddresses:
    - 'mcp:8080'

mcpServers:
  LibreBoxMCP:
    type: 'streamable-http'
    url: 'http://mcp:8080/mcp'
    title: 'Sandbox'
    description: 'Core LibreBox server. Sandbox for shell, files, and background processes.'
    serverInstructions: true
    timeout: 86400000

  Composio:
    type: 'streamable-http'
    url: 'https://connect.composio.dev/mcp'
    title: 'Composio'
    description: 'Gateway to third-party applications and APIs. Executes authenticated actions in connected external services.'
    requiresOAuth: true
    serverInstructions: true
    timeout: 86400000

rateLimits:
  mcpApps:
    resourcesPerMinute: 1000
    toolCallsPerMinute: 1000

endpoints:
  anthropic:
    titleModel: 'claude-haiku-4-5-20251001'
  openAI:
    titleModel: 'gpt-4o-mini'
  google:
    titleModel: 'gemini-2.5-flash'

  agents:
    recursionLimit: 999999
    maxRecursionLimit: 999999
    maxToolCallArgBytes: 0
    maxSubagents: 50
    maxCitations: 50
    maxCitationsPerFile: 10

    allowedProviders:
      - 'anthropic'
      - 'openAI'
      - 'google'
      - 'Deepseek'
      - 'Groq'
      - 'OpenRouter'
      - 'xAI'

    capabilities:
      - 'actions'
      - 'artifacts'
      - 'ask_user_question'
      - 'context'
      - 'deferred_tools'
      - 'end_after_tools'
      - 'hide_sequential_outputs'
      - 'memory'
      - 'run_in_background'
      - 'skills'
      - 'subagents'
      - 'tool_intents'
      - 'tools'
      - 'web_search'

    skills:
      maxCatalogSkills: 100

  custom:
    - name: 'Deepseek'
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'
      models:
        default: ['deepseek-flash']
        fetch: true
      titleModel: 'deepseek-flash'
      modelDisplayLabel: 'Deepseek'
      customParams:
        includeReasoningContent: true
        includeReasoningHistory: true
    - name: 'Groq'
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1'
      models:
        default: ['openai/gpt-oss-20b']
        fetch: true
      titleModel: 'openai/gpt-oss-20b'
      modelDisplayLabel: 'Groq'
      customParams:
        includeReasoningContent: true
        includeReasoningHistory: true
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['deepseek/deepseek-v4.1-flash']
        fetch: true
      titleModel: 'deepseek/deepseek-v4.1-flash'
      modelDisplayLabel: 'OpenRouter'
      dropParams: ['stop']
      customParams:
        includeReasoningContent: true
        includeReasoningHistory: true
    - name: 'xAI'
      apiKey: '${XAI_API_KEY}'
      baseURL: 'https://api.x.ai/v1'
      models:
        default: ['grok-4.3']
        fetch: true
      titleModel: 'grok-4.3'
      modelDisplayLabel: 'Grok'
      customParams:
        includeReasoningContent: true
        includeReasoningHistory: true

memory:
  validKeys:
    - 'identity'
    - 'preferences'
    - 'work_info'
    - 'tech_stack'
    - 'skills'
    - 'goals'
    - 'interests'
    - 'constraints'
    - 'context'

summarization:
  trigger:
    type: 'token_ratio'
    value: 0.95

  reserveRatio: 0.05
  maxSummaryTokens: 16384

webSearch:
  searchProvider: 'serper'
  scraperProvider: 'firecrawl'
  rerankerType: 'jina'

  serperApiKey: '${SERPER_API_KEY}'
  firecrawlApiKey: '${FIRECRAWL_API_KEY}'
  firecrawlVersion: '${FIRECRAWL_VERSION}'
  jinaApiKey: '${JINA_API_KEY}'

  safeSearch: 0