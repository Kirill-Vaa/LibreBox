name: libre-box

x-healthcheck: &default-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 20s

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mongodb:
    image: mongo:9.0
    container_name: libre-box-mongodb
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - data_mongo
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  librechat:
    image: libre-box-librechat:local
    build:
      context: ./services/librechat
      dockerfile: Dockerfile
      args:
        LIBRECHAT_BASE_IMAGE: librechat/librechat:v0.8.9-rc1
    container_name: libre-box-librechat
    command: ["node", "api/server/index.js"]
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./librechat/.env
    environment:
      ADMIN_PANEL_SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      ADMIN_PANEL_URL: https://${DOMAIN}/admin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-user_provided}
      CREDS_IV: ${CREDS_IV}
      CREDS_KEY: ${CREDS_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-user_provided}
      DOMAIN_CLIENT: https://${DOMAIN}
      DOMAIN_SERVER: https://${DOMAIN}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-user_provided}
      GOOGLE_KEY: ${GOOGLE_API_KEY:-user_provided}
      GROQ_API_KEY: ${GROQ_API_KEY:-user_provided}
      IMAGE_GEN_OAI_API_KEY: ${OPENAI_API_KEY:-user_provided}
      JINA_API_KEY: ${JINA_API_KEY:-user_provided}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
      OPENAI_API_KEY: ${OPENAI_API_KEY:-user_provided}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-user_provided}
      SERPER_API_KEY: ${SERPER_API_KEY:-user_provided}
      XAI_API_KEY: ${XAI_API_KEY:-user_provided}
    volumes:
      - ./librechat:/app/config:ro
      - ./librechat/plugins:/app/plugins:ro
      - ./librechat/skill:/app/skill:ro
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - ./logs/librechat:/app/logs
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3080/readyz || exit 1"]
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - admin_api
      - app
      - data_mongo
      - edge
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 512

  egress:
    image: libre-box-egress:local
    build:
      context: ./services/egress
      dockerfile: Dockerfile
    container_name: libre-box-egress
    environment:
      EGRESS_ALLOW_CIDRS: ${EGRESS_ALLOW_CIDRS:-}
      EGRESS_BLOCK_CIDRS: ${EGRESS_BLOCK_CIDRS:-}
      EGRESS_INNER_IP: 10.88.0.2
      SANDBOX_GATEWAY_IP: 10.88.0.1
      SANDBOX_SUBNET: 10.88.0.0/24
      UPSTREAM_GATEWAY_IP: 10.88.1.1
    tmpfs:
      - /run
    sysctls:
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.ip_forward: "1"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - KILL
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETGID
      - SETUID
    networks:
      egress_wan:
        ipv4_address: 10.88.1.3
      sandbox_net:
        ipv4_address: 10.88.0.2
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 64

  sandbox:
    image: libre-box-sandbox:${SANDBOX_TARGET:-standard}
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
      target: ${SANDBOX_TARGET:-standard}
    container_name: libre-box-sandbox
    environment:
      MAKEFLAGS: -j${SANDBOX_CPU_LIMIT:-4}
      OMP_NUM_THREADS: ${SANDBOX_CPU_LIMIT:-4}
    depends_on:
      egress:
        condition: service_healthy
    volumes:
      - ./data:/root/data
      - x11_socket:/tmp/.X11-unix
    shm_size: ${SANDBOX_SHM_SIZE:-1gb}
    dns:
      - 10.88.0.1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    networks:
      sandbox_net:
        ipv4_address: 10.88.0.10
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: ${SANDBOX_CPU_LIMIT:-4}
          memory: ${SANDBOX_MEMORY_LIMIT:-8G}
          pids: ${SANDBOX_PIDS_LIMIT:-4096}

  browser-view:
    image: libre-box-browser-view:local
    build:
      context: ./services/browser-view
      dockerfile: Dockerfile
    container_name: libre-box-browser-view
    volumes:
      - x11_socket:/tmp/.X11-unix:ro
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge_browser
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

  docker-socket-proxy:
    image: libre-box-docker-proxy:local
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
      target: socket-proxy
    container_name: libre-box-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - socket
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 64

  mcp:
    image: libre-box-mcp:local
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
      target: mcp
    container_name: libre-box-mcp
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    environment:
      DEFAULT_COMMAND_TIMEOUT_SECONDS: ${DEFAULT_COMMAND_TIMEOUT_SECONDS:-600}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      EGRESS_ALLOW_CIDRS: ${EGRESS_ALLOW_CIDRS:-}
      EGRESS_BLOCK_CIDRS: ${EGRESS_BLOCK_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_SERIALIZE: ${LOG_SERIALIZE:-true}
      OUTPUT_CHAR_LIMIT: ${OUTPUT_CHAR_LIMIT:-100000}
    volumes:
      - ./data:/root/data
      - ./logs/mcp:/app/logs
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    networks:
      - app
      - socket
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256

  auth-gate:
    image: libre-box-auth-gate:local
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
      target: auth-gate
    container_name: libre-box-auth-gate
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_SERIALIZE: ${LOG_SERIALIZE:-true}
      MONGO_URI: mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
    volumes:
      - ./logs/auth-gate:/app/logs
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data_mongo
      - edge_auth
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

  admin-panel:
    image: libre-box-admin-panel:local
    build:
      context: https://github.com/LibreChat-AI/admin-panel.git#main
      args:
        VITE_BASE_PATH: /admin
    container_name: libre-box-admin-panel
    depends_on:
      librechat:
        condition: service_healthy
    environment:
      API_SERVER_URL: http://librechat:3080
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      VITE_API_BASE_URL: https://${DOMAIN}
      VITE_BASE_PATH: /admin
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - admin_api
      - edge_admin
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

  filebrowser:
    image: gtstef/filebrowser:latest
    container_name: libre-box-filebrowser
    user: "0:0"
    environment:
      FILEBROWSER_CONFIG: /config/config.yaml
    volumes:
      - ./data:/srv
      - ./services/filebrowser/config.yaml:/config/config.yaml:ro
      - filebrowser_db:/database
      - filebrowser_cache:/cache
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/files/health || exit 1"]
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    networks:
      - edge_files
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  nginx:
    image: nginx:alpine
    container_name: libre-box-nginx
    depends_on:
      librechat:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|REAL_IP_PROVIDER)$$
      REAL_IP_PROVIDER: ${REAL_IP_PROVIDER:-none}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/assets:/etc/nginx/assets:ro
      - ./nginx/docker-entrypoint.d/40-reload-on-cert-change.sh:/docker-entrypoint.d/40-reload-on-cert-change.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8099/healthz || exit 1"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - edge
      - edge_admin
      - edge_auth
      - edge_browser
      - edge_files
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

  certbot:
    image: certbot/certbot:latest
    container_name: libre-box-certbot
    profiles:
      - certbot
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    command: ["renew-loop"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./services/certbot/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/certbot:/var/www/certbot
      - certbot_letsencrypt:/etc/letsencrypt
    tmpfs:
      - /tmp
      - /var/lib/letsencrypt
      - /var/log/letsencrypt
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - edge
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

volumes:
  certbot_letsencrypt:
    driver: local
  filebrowser_cache:
    driver: local
  filebrowser_db:
    driver: local
  librechat_images:
    driver: local
  librechat_uploads:
    driver: local
  mongo_data:
    driver: local
  x11_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=1777

networks:
  admin_api:
    driver: bridge
    internal: true
  app:
    driver: bridge
    internal: true
  data_mongo:
    driver: bridge
    internal: true
  edge:
    driver: bridge
  edge_admin:
    driver: bridge
    internal: true
  edge_auth:
    driver: bridge
    internal: true
  edge_browser:
    driver: bridge
    internal: true
  edge_files:
    driver: bridge
    internal: true
  egress_wan:
    driver: bridge
    ipam:
      config:
        - gateway: 10.88.1.1
          subnet: 10.88.1.0/24
  sandbox_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - gateway: 10.88.0.1
          subnet: 10.88.0.0/24
  socket:
    driver: bridge
    internal: true