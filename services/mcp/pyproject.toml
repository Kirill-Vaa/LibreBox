[project]
name = "libre-box-mcp"
version = "1.0.0"
description = "LibreBox — Sandbox MCP Server"
requires-python = ">=3.14"
dependencies = [
    "loguru",
    "pydantic",
    "pydantic-settings",
    "starlette",
    "uvicorn",
    "uvloop",
]

[project.optional-dependencies]
mcp = [
    "aiodocker",
    "aiohttp",
    "mcp",
    "pillow",
]
auth-gate = [
    "pyjwt",
    "pymongo",
]
socket-proxy = [
    "aiohttp",
]

[dependency-groups]
dev = [
    "libre-box-mcp[auth-gate,mcp]",
    "mypy",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 200
src = ["."]

[tool.ruff.per-file-target-version]
"sandbox_scripts/**" = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "A", "C4", "T20", "SIM", "RUF", "TID", "PIE"]
ignore = ["E501", "I001", "S104", "S603", "S607", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"infrastructure/fs/landlock_exec.py" = ["S606"]
"sandbox_scripts/**" = ["T201"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiodocker.*", "mcp.*", "uvloop.*"]
ignore_missing_imports = true