worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 2048;
    server_tokens       off;

    client_max_body_size      100m;
    client_header_timeout     15s;
    client_body_timeout       60s;
    send_timeout              60s;
    keepalive_timeout         65;
    keepalive_requests        1000;
    reset_timedout_connection on;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/css text/javascript text/plain application/javascript application/json application/manifest+json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default "upgrade";
        ""      "";
    }

    map $cookie_filebrowser_quantum_jwt $filebrowser_cookie {
        default "filebrowser_quantum_jwt=$cookie_filebrowser_quantum_jwt";
        ""      "";
    }

    map $upstream_http_content_security_policy $filebrowser_csp {
        "~'nonce-(?<filebrowser_nonce>[A-Za-z0-9+/=_-]+)'" "script-src https://$http_host/files/public/static/ 'nonce-$filebrowser_nonce'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
        ""                                                "script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
        default                                           $upstream_http_content_security_policy;
    }

    map $uri $librechat_asset_expires {
        "~^/assets/.+\.[\w-]{8}\.(?:js|css)$" max;
        default                               off;
    }

    map $uri $is_loggable {
        default    1;
        ~^/assets/ 0;
    }

    log_format main_format
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main_format if=$is_loggable;

    limit_req_zone      $binary_remote_addr zone=req_admin:4m      rate=10r/s;
    limit_req_zone      $binary_remote_addr zone=req_browser_ws:4m rate=1r/s;
    limit_req_zone      $binary_remote_addr zone=req_general:16m   rate=30r/s;
    limit_req_zone      $binary_remote_addr zone=req_login:8m      rate=5r/s;
    limit_req_status    429;
    limit_req_log_level warn;

    limit_conn_zone      $binary_remote_addr zone=conn_browser_ws:4m;
    limit_conn_zone      $binary_remote_addr zone=conn_per_ip:16m;
    limit_conn_status    429;
    limit_conn_log_level warn;

    resolver 127.0.0.11 ipv6=off valid=30s;

    include /etc/nginx/conf.d/*.conf;
}